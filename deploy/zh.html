<h1>哥德巴赫证明项目</h1>
<p>强哥德巴赫猜想：每个不小于 4 的偶数都可以表示为两个素数之和。这个猜想仍然开放。</p>
<h2>研究路线</h2>
<ol><li>用 4 和 10 的素数分解检验 Lean 验证流程。</li><li>形式化有限区间搜索，逐段检查证书和覆盖边界。</li><li>研究筛法与表示数下界，独立复现三素数定理及陈氏定理的相关结果。</li><li>若得到严格的最终阈值，用有限区间证书覆盖阈值以下。</li></ol>

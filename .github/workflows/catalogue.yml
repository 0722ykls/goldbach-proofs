name: Goldbach domain reachability
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check public HTTPS hosts from the runner
        shell: bash
        run: |
          set +e
          for site in https://www.goldbach.tech https://www.movan.tech/goldbach; do
            for path in / /problems/ /problems/square-packing/; do
              url="$site$path"
              curl -4 --noproxy '*' --silent --show-error --connect-timeout 6 --max-time 9 \
                -o /dev/null -w 'response %{http_code}, certificate verification %{ssl_verify_result}\n' "$url"
              code="$?"
              printf 'curl exit=%s URL=%s\n' "$code" "$url"
            done
          done
